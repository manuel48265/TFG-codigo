[project]
name = "tfg-codigo"
version = "0.1.0"
description = "Implementación y comparación de métodos de CI de distintos papers frente a sus implementaciones en librerías existentes."
authors = [
    { name = "manuel48265", email = "manuelsantana@correo.ugr.es" }
]
requires-python = ">=3.12"
dependencies = [
    "causal-learn>=0.1.4.8",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tigramite>=5.2.10.1",
    "xgboost>=3.4.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "rpy2>=3.6.8",
    "ruff>=0.16.8",
    "scipy-stubs>=1.18.1.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "ANN"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "rpy2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "causallearn.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
